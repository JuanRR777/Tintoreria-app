<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' http://127.0.0.1:8000 ws://127.0.0.1:8000;
                 style-src 'self' 'unsafe-inline';
                 script-src 'self' 'unsafe-inline';
                 img-src 'self' data:">
  <title>Tintoreria de Hilos</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/vendor/chart.umd.js"></script>
  <script src="js/vendor/sweetalert2.all.min.js"></script>
</head>
<body>

  <!-- Pantalla de login -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/>
        </svg>
      </div>
      <h1 class="login-title">Tintoreria de Hilos</h1>
      <p class="login-subtitle">Sistema de gestion de laboratorio</p>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <input id="username" type="text" class="form-input" placeholder="usuario" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contrasena</label>
          <input id="password" type="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="login-error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          Ingresar
        </button>
      </form>
      <p class="login-version" id="login-version" data-app-version aria-live="polite"></p>
    </div>
  </div>

  <!-- Shell de la aplicacion (sidebar + contenido) -->
  <div id="app" class="app-layout" style="display:none">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button class="sidebar-toggle" id="btn-sidebar-toggle" title="Contraer menu" aria-label="Contraer menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="18" x2="20" y2="18"></line>
          </svg>
        </button>
        <div class="sidebar-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/>
          </svg>
        </div>
        <span class="sidebar-brand">Tintoreria</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item" data-view="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>Dashboard</span>
        </a>

        <div class="nav-section">Laboratorio</div>

        <a href="#" class="nav-item" data-view="chemicals">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 3v11l-3 3h12l-3-3V3"/><path d="M6 3h12"/><circle cx="12" cy="17" r="1"/></svg>
          <span>Productos</span>
          <span id="badge-low-stock" class="nav-badge" style="display:none"></span>
        </a>

        <a href="#" class="nav-item" data-view="stock">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <span>Inventario</span>
        </a>

        <a href="#" class="nav-item" data-view="requests">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>Solicitudes</span>
        </a>

        <a href="#" class="nav-item" data-view="recipes">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>Recetas</span>
        </a>

        <div class="nav-section">Produccion</div>

        <a href="#" class="nav-item" data-view="processes">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Procesos</span>
        </a>

        <a href="#" class="nav-item" data-view="weighing">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3a1 1 0 0 1 1 1v1h5a1 1 0 0 1 .8 1.6L16 10v8a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-8L5.2 6.6A1 1 0 0 1 6 5h5V4a1 1 0 0 1 1-1z"/></svg>
          <span>Pesaje</span>
        </a>

        <a href="#" class="nav-item" data-view="machines">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
          <span>Maquinas</span>
        </a>

        <div class="nav-section">Analisis</div>

        <a href="#" class="nav-item" data-view="reports">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Reportes</span>
        </a>

        <div class="nav-section">Sistema</div>

        <a href="#" class="nav-item" data-view="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
          <span>Configuracion</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-details">
            <span class="user-name" id="user-name">Cargando...</span>
            <span class="user-role" id="user-role"></span>
          </div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Cerrar sesion">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Contenido principal -->
    <main class="main-content">
      <div id="view-container" class="view-container"></div>
      <div class="app-version-chip" id="app-version-chip" data-app-version hidden></div>
    </main>

  </div>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div id="modal-box" class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title"></h3>
        <button class="modal-close" id="modal-close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
